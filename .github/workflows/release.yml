# Builds, tests and releases ghcr.io/majikmate/devcontainer-classroom-web-advanced.
# The logic is in the shared workflow of devcontainer-core:
# https://github.com/majikmate/devcontainer-core/blob/main/.github/workflows/devcontainer-image.yml
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Nightly check at 00:17 UTC (02:17 CEST), one hour after the base image
  # (23:17 UTC): a new base image leads to a new release
  schedule:
    - cron: "17 0 * * *"
  # Manual check ("Run workflow"): first brings devcontainer-base and
  # devcontainer-core up to date (option upstream, chain build), then runs the
  # same check as the nightly run
  workflow_dispatch:
    inputs:
      upstream:
        description: First update the upstream images (devcontainer-base, which first updates devcontainer-core)
        type: boolean
        default: true
      force:
        description: Release a new version even if no input changed
        type: boolean
        default: false
      bump:
        description: Version step
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time; pull requests cancel their older runs
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: majikmate/devcontainer-core/.github/workflows/devcontainer-image.yml@main
    permissions:
      contents: write
      packages: write
      actions: write
    # GitHub App that starts the Release workflow of devcontainer-base (manual chain build)
    secrets:
      app-client-id: ${{ secrets.DEVCONTAINER_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.DEVCONTAINER_APP_PRIVATE_KEY }}
    with:
      image-title: DevContainer Classroom Web Advanced
      image-description: Advanced classroom Dev Container for web development (Debian 13, Node.js LTS, Deno LTS, Prettier with Tailwind CSS sorting, ESLint, Vitest, Playwright) with AI assistance
      # Same major version as the base image in .devcontainer/Dockerfile
      major-version: 2
      # The image in the FROM line of .devcontainer/Dockerfile
      upstream-repositories: devcontainer-base
      update-upstream: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream == true }}
      force: ${{ inputs.force || false }}
      bump: ${{ inputs.bump || 'auto' }}
